<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 430"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#327872"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#183c3a} .label{font-size:17px}.sub{font-size:13px;fill:#52716e} rect{fill:#eff7f4;stroke:#9fc5bc;rx:9} .wire{fill:none;stroke:#327872;stroke-width:2;marker-end:url(#arrow)}</style><text x="25" y="32" font-size="22">L / R : identical audio paths</text>
<rect x="25" y="65" width="150" height="95"/><text x="40" y="95" class="label">6.35 mm TRS</text><text x="40" y="120" class="sub">1k + 1uF / leg</text><text x="40" y="144" class="sub">AC coupled input</text>
<path class="wire" d="M175 110H210"/><rect x="210" y="65" width="175" height="95"/><text x="225" y="95" class="label">INA1650</text><text x="225" y="120" class="sub">Differential receiver</text><text x="225" y="144" class="sub">Gain = 1</text>
<path class="wire" d="M385 110H420"/><rect x="420" y="65" width="175" height="95"/><text x="435" y="95" class="label">RV_L / RV_R : 10k</text><text x="435" y="120" class="sub">Independent / linear</text><text x="435" y="144" class="sub">Attenuation 0 ... 1</text>
<path class="wire" d="M595 110H630"/><rect x="630" y="65" width="190" height="95"/><text x="645" y="95" class="label">OPA1679 / A</text><text x="645" y="120" class="sub">1 + 90k / 10k = 10</text><text x="645" y="144" class="sub">Feedback cap 10pF</text>
<path class="wire" d="M820 110H855"/><rect x="855" y="65" width="135" height="95"/><text x="870" y="95" class="label">100 ohm</text><text x="870" y="120" class="sub">Output isolation</text>
<path class="wire" d="M990 110H1040"/><rect x="1040" y="65" width="155" height="95"/><text x="1055" y="95" class="label">3.5 mm TS</text><text x="1055" y="120" class="sub">Eurorack output</text>
<path class="wire" d="M1015 110V208H130V250"/><text x="500" y="197" class="sub">Meter senses the output jack AFTER the 100 ohm resistor</text>
<rect x="25" y="255" width="255" height="105"/><text x="40" y="285" class="label">OPA1679 / B + C</text><text x="40" y="312" class="sub">Precision full-wave rectifier</text><text x="40" y="337" class="sub">ABS = 0.2 x |Vout|</text>
<path class="wire" d="M280 305H325"/><rect x="325" y="255" width="255" height="105"/><text x="340" y="285" class="label">OPA1679 / D + RC</text><text x="340" y="312" class="sub">1k / 100nF : attack 0.1 ms</text><text x="340" y="337" class="sub">1M / 100nF : release 100 ms</text>
<path class="wire" d="M580 305H625"/><rect x="625" y="255" width="255" height="105"/><text x="640" y="285" class="label">LM339B</text><text x="640" y="312" class="sub">OPA1678 buffer + TL431B</text><text x="640" y="337" class="sub">0.5 / 2 / 5 / 8 Vpeak</text>
<path class="wire" d="M880 305H925"/><rect x="925" y="255" width="270" height="105"/><text x="940" y="285" class="label">4 LEDs per channel</text><text x="940" y="312" class="sub">Green / Green / Amber / Red</text><text x="940" y="337" class="sub">Red = level warning, not clip proof</text>
<text x="25" y="405" class="sub">Revision A / analog only / +/-12 V supply / 4 HP is a mechanical target, not verified placement</text></svg>